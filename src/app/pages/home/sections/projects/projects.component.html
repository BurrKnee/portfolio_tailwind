<h1>Projects</h1>
<div class="content pt-4">
  <div class="project-grid">
    @for (project of projects; track project.title) {
      <article class="project" (click)="openCaseStudy(project)">
        <div class="project-wrap">
          <div class="project-img">
            <img [src]="project.image" [alt]="project.alt" />
          </div>
          <div class="project-text">
            <span class="project-title">{{ project.title }}</span>
            <p class="project-parragraph">
              {{ project.summary }}
            </p>
            <ul class="project-stack" aria-label="Project skills and tools">
              @for (item of project.stack; track item) {
                <li>{{ item }}</li>
              }
            </ul>
          </div>
        </div>

        <div class="project-footer">
          <div class="project-buttons">
            @for (link of project.links; track link.href) {
              <div class="project-button">
                <a
                  [href]="link.href"
                  target="_blank"
                  [attr.aria-label]="link.label"
                  (click)="$event.stopPropagation()"
                >
                  @if (link.iconSrc) {
                    <img
                      [src]="link.iconSrc"
                      [alt]="link.iconAlt || ''"
                      width="28"
                      height="28"
                    />
                  } @else {
                    <span class="material-symbols-outlined">
                      {{ link.icon }}
                    </span>
                  }
                </a>
              </div>
            }
          </div>

          <button
            type="button"
            class="case-study-toggle"
            (click)="$event.stopPropagation(); openCaseStudy(project)"
          >
            <span>Read case study</span>
            <span class="material-symbols-outlined"> open_in_new </span>
          </button>
        </div>
      </article>
    }
  </div>
</div>

<app-case-study-modal
  [project]="selectedProject"
  (close)="closeCaseStudy()"
></app-case-study-modal>
